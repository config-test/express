version: 2.1

jobs:
  express:
    docker:
      - image: cimg/node:24.21
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-node-modules-{{ checksum "package.json" }}
            - v1-node-modules-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          key: v1-node-modules-{{ checksum "package.json" }}
          paths:
            - node_modules
      # No build step — this library has no build script.
      - run:
          name: Run tests
          command: npm test
      - run:
          name: Lint
          command: npm run lint

workflows:
  main:
    jobs:
      - express
